  # ---------------------------------------------------------------------------
  # Macro prints
  # ---------------------------------------------------------------------------
  #
  # Almost every trigger clause ever written names one of these, and none of them
  # was a series, which is the single largest reason trigger clauses typed at 38%
  # while phase conditions typed at 88%.
  #
  # STORE THE FIGURE THE CLAUSE REFERS TO, NOT THE FIGURE FRED SERVES.
  # A clause says "core PCE at 0.2%" and "core CPI 0.3%". Those are
  # month-over-month percentages. FRED serves an index level: PCEPILFE reads
  # 130.658 for July 2026. A condition written against the index level would be
  # false for ever and would look entirely correct, which is the same failure the
  # basis-point rule above exists to prevent. The worker computes the change from
  # the two most recent index levels and stores that.
  #
  # Which figure each one is:
  #   CPI, PCE, retail sales, retail control   month-over-month percent
  #   payrolls                                 month-over-month level change, thousands
  #   unemployment                             level, percent
  #   JOLTS openings                           level, millions, because that is how it is quoted
  #
  # The release offsets are `+Nb`, US business days after the end of the data
  # month, and each is set to the LATEST the print has landed rather than the
  # typical, so the row reads `fresh` until the figure is reliably out. Erring
  # late costs a day of `fresh` on a figure already published; erring early puts
  # a false amber on the board every single month. Measured against the 2026
  # calendar the Catalyst Monitor carries: CPI +9b, PCE +21b, payrolls +2b to
  # +5b, JOLTS +20b to +23b, retail +10b. The declared offsets sit one or two
  # business days past the latest of those, which is a day or two of `fresh` on
  # a published figure and never a false `overdue`.

