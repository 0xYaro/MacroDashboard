  # ---------------------------------------------------------------------------
  # Treasury auction results
  # ---------------------------------------------------------------------------
  #
  # Three clauses in a single W40 scenario set turn on how an auction went and
  # none of them could be typed: "the Oct 6-8 3Y/10Y/30Y cluster clears without a
  # second record tail", "a second tailing auction in the Oct 6-8 cluster", "the
  # Oct 6-8 auction cluster clears cleanly".
  #
  # THERE IS NO TAIL SERIES AND THERE MUST NOT BE ONE.
  # A tail is the high yield less the WHEN-ISSUED yield at the bidding deadline.
  # Treasury does not publish when-issued: it is a dealer quote from a grey
  # market and it is in no feed here. averageMedianYield is in the feed and is
  # not a substitute, because the median of accepted competitive bids describes
  # the auction's own distribution while a tail is the gap between the auction
  # and a market quoted outside it. Subtracting one from the other gives a
  # number in basis points that would look exactly like a tail, move roughly
  # with one, and be a different quantity. If a tail is ever needed it must come
  # as its own series from a source that publishes when-issued.
  #
  # What the feed does serve, officially rather than as a quote, is the high
  # yield and the bid-to-cover, and a condition over those is checkable against
  # a published record. A clause whose text says "tail" must be narrowed to what
  # the expression actually checks before it is typed against these.
  #
  # KEYED PER TENOR, ON originalSecurityTerm.
  # A reopening is still an auction of its original tenor: the 19-Year 11-Month
  # bond auctioned 2026-09-15 is the 20-Year, and it is W39's "the 20Y tailed
  # 2 bp at a record 5.42%". A clause names a specific tenor's most recent
  # auction, so each tenor is its own series and the newest auction wins.
  #
  # THE FILTER IS NOT OPTIONAL. The same endpoint serves bills, TIPS and
  # floating-rate notes. A TIPS reopening on 2026-09-17 carries
  # originalSecurityTerm 10-Year and highYield 2.6530, which is a REAL yield
  # against the nominal ten-year's 4.8340 on 2026-09-09. Unfiltered it would be
  # the ten-year's newest reading: plausible alone, wrong in every condition,
  # and invisible on a row that says only "10-Year auction, 2.65%".
  #
  # RELEASE RULE: event, deliberately.
  # An auction happens on an announced date and has no cadence, so no rule in
  # the grammar describes it and forcing one would make every tenor overdue on
  # the days between its auctions. next_expected is therefore null by rule. The
  # date is still knowable: TreasuryDirect's companion `upcoming` feed publishes
  # it, the fetcher carries it in extra.next_expected, and the evaluate step
  # prefers a stated next date over a derived one. The row says when the next
  # ten-year auction is because Treasury said so, not because a cadence was
  # invented for it.

  - key: auction_high_yield_2y
    label: 2Y auction high yield
    table_group: Macro & Fiscal State
    ordinal: 17
    value_kind: numeric
    unit: percent
    decimals: 3
    cadence: event
    release_rule: event
    replayable: true
    source_name: TreasuryDirect auction results (2-Year)
    fetch_path: deterministic
    tier_floor: 1

