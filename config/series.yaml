# series.yaml
#
# Asserted reference data: every series this system carries, its canonical unit, its
# cadence and its release rule. This file is the one source for macro_core.series, which
# is never written by a fetch. docs/CONTRACT.md's "Sources and their cadence" table is a
# summary of this file and must stay in step with it.
#
# 76 series in four table groups: 20 Price & Levels, 13 Sentiment & Positioning,
# 13 Flows & Structure, 30 Macro & Fiscal State.
#
# -----------------------------------------------------------------------------
# Fields
# -----------------------------------------------------------------------------
#
# key          The stable snake_case identifier every condition expression resolves
#              against. Never reused and never renamed: a condition names a key, so a
#              rename silently breaks a tracker rather than failing loudly.
# label        The display string as the journal writes it. Free to change.
# table_group  Price & Levels | Sentiment & Positioning | Flows & Structure |
#              Macro & Fiscal State. The journal's four snapshot headings, verbatim.
# ordinal      Position inside the table group, in journal order. Asserted, not derived.
# value_kind   numeric | text. A text series stores value null and its content in
#              display, and may only appear in a manual condition.
# unit         The one canonical unit for this series. Every condition referencing it is
#              written in this unit. Null for a text series.
# decimals     Display precision. Not storage precision: every value is numeric.
# cadence      session | daily | weekly | monthly | event.
# release_rule Declarative, grammar below. What next_expected is computed from.
# replayable   True if the source serves history, so a missed run is recoverable.
#              False if it only serves the present moment, in which case a missed
#              reading is a permanent macro_quality.gap and is never interpolated.
# source_name  The producer, named the way the journal's Source column names it.
# fetch_path   deterministic | agent_0930. deterministic runs on both the 09:30 and the
#              21:00 runs. agent_0930 runs only at 09:30, and the 21:00 run carries the
#              previous observation forward as an observation with its own older asof.
# tier_floor   The best tier this source can ever attain. A top-ten-exchange proxy or an
#              aggregator quote can never be Tier 1.
#
# Only those twelve keys are loaded. Everything else in this file is a comment.
#
# -----------------------------------------------------------------------------
# The release_rule grammar
# -----------------------------------------------------------------------------
#
#   release_rule := <base> [ "; " <key> "=" <value> ]*
#
# Six bases, each naming the calendar the series advances on:
#
#   us_session       One observation per US equity trading session (NYSE calendar).
#   us_business_day  One per US federal business day (SIFMA / Treasury calendar).
#   calendar_day     One per calendar day, UTC. A 24-hour market has no closed days.
#   weekly           One per week.
#   monthly          One per calendar month.
#   event            No schedule. next_expected is null and the row is never overdue.
#
# Two keys:
#
#   asof=    Which day the observation describes.
#            weekly: mon | tue | wed | thu | fri.
#            monthly: eom, the last day of the data month.
#            Omitted for the three daily bases, where asof is the day itself.
#   release= When that observation becomes readable. Omitted means same_day.
#            <weekday>          a weekday name, in the same week as asof
#            +Nb                N US business days after asof
#            +Nd                N calendar days after asof
#            next_month_day:N   day N of the month after the asof month
#
# next_expected is computed by advancing the base's calendar one step past the latest
# observation's asof, then applying release. A weekly series four days from its next
# print is therefore `due`, not `overdue`, which is the whole reason the rule is
# declared here rather than guessed from the gap between the last two rows.
#
# The nine shapes in use:
#
#   us_session                                    every US session, same day
#   us_session; release=+1d                       ETF flows, tallied the day after the session
#   us_business_day                               every Treasury business day, same day
#   us_business_day; release=+1b                  ICE OAS, published one business day late
#   calendar_day                                  every calendar day
#   weekly; asof=tue; release=fri                 CFTC: Tuesday positions, Friday release
#   weekly; asof=wed; release=thu                 H.4.1: Wednesday balance, Thursday 16:30 ET
#   monthly; asof=eom; release=next_month_day:15  State Street: data month, mid next month
#   event                                         event driven, no scheduled next
#
# -----------------------------------------------------------------------------
# Three corrections this file makes against the pipeline it replaces
# -----------------------------------------------------------------------------
#
# 1. Cash indices are their own series, beside the futures, not an `extra` field on
#    them. Every phase condition, scenario band and setup level written to date refers
#    to the cash index, and a condition cannot reference a value buried in another
#    series' extra. R1 exists because the two were once conflated in the week-over-week
#    arithmetic.
#
# 2. hy_oas_bps and ig_oas_bps are stored in BASIS POINTS, not percent. FRED serves
#    percent and the journal prints both ("2.70% (270 bps)"), but every condition is
#    written in basis points ("HY under 292 bps"). A condition comparing 2.70 against
#    300 is silently false and looks correct.
#
# 3. CME FedWatch has its own key. 2026-W39.points.json holds two rows both labelled
#    "Next FOMC" because the search agent returned the FedWatch reading under the wrong
#    metric label and the merge mapped both onto the same row. next_fomc is the meeting
#    date; fedwatch_next_fomc is the market-implied path into it. They have different
#    cadences, so they could never have shared a row.

series:

  # ===========================================================================
  # Price & Levels
  # ===========================================================================
  #
  # The index rows are front-month futures (~24h quotes, so they capture weekend moves
  # the Friday cash close misses) paired with their cash index. Nasdaq is cash only:
  # there is no clean future. Both halves of each pair carry the same cadence, because
  # a phase condition may name either.

  - key: spx_front
    label: S&P 500 (ES=F)
    table_group: Price & Levels
    ordinal: 1
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (ES=F)
    fetch_path: deterministic
    tier_floor: 1

  # Every S&P level in the Setup Ledger (7,500-7,560 entry, 7,450 invalidation,
  # 7,800 target) is a cash level. extra carries dma200_pct and dma200_slope.
  - key: spx_cash
    label: S&P 500 (cash)
    table_group: Price & Levels
    ordinal: 2
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^GSPC)
    fetch_path: deterministic
    tier_floor: 1

  - key: dow_front
    label: Dow Jones (YM=F)
    table_group: Price & Levels
    ordinal: 3
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (YM=F)
    fetch_path: deterministic
    tier_floor: 1

  - key: dow_cash
    label: Dow Jones (cash)
    table_group: Price & Levels
    ordinal: 4
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^DJI)
    fetch_path: deterministic
    tier_floor: 1

  - key: nasdaq_cash
    label: Nasdaq Composite (cash)
    table_group: Price & Levels
    ordinal: 5
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^IXIC)
    fetch_path: deterministic
    tier_floor: 1

  - key: rut_front
    label: Russell 2000 (RTY=F)
    table_group: Price & Levels
    ordinal: 6
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (RTY=F)
    fetch_path: deterministic
    tier_floor: 1

  - key: rut_cash
    label: Russell 2000 (cash)
    table_group: Price & Levels
    ordinal: 7
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^RUT)
    fetch_path: deterministic
    tier_floor: 1

  # Crypto is daily on a calendar_day release rule, not a cadence of its own.
  # A 24-hour market sampled once per run has one observation per calendar day and no
  # closed days, which is exactly what calendar_day means; the market never closing is a
  # property of the release rule, not of the cadence.
  - key: btc
    label: BTC
    table_group: Price & Levels
    ordinal: 8
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: CoinGecko market_chart
    fetch_path: deterministic
    tier_floor: 1

  - key: eth
    label: ETH
    table_group: Price & Levels
    ordinal: 9
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: CoinGecko market_chart
    fetch_path: deterministic
    tier_floor: 1

  - key: sol
    label: SOL
    table_group: Price & Levels
    ordinal: 10
    value_kind: numeric
    unit: usd
    decimals: 2
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: CoinGecko market_chart
    fetch_path: deterministic
    tier_floor: 1

  # The crypto framework's anchor for Phase 1 and for both the 5-to-1 and the
  # 1-to-2 transition recipes, and the one crypto tracker condition that could
  # not be typed at all: "BTC holds above the 50W MA" was a manual row.
  #
  # The mean of the last 50 WEEKLY closes, not a 350-day mean of daily closes.
  # A week's close is its final daily point, ISO weeks ending Sunday, which is
  # the boundary every crypto weekly candle already uses. CoinGecko's keyless
  # market_chart serves 366 daily points at days=365, which is 52 weeks, so
  # there is margin for two and no more. Fewer than 50 complete weeks yields
  # null with a note: a 43-week average wearing the name of a 50-week one is
  # worse than an absent figure.
  - key: btc_50w_ma
    label: BTC 50-week moving average
    table_group: Price & Levels
    ordinal: 20
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: weekly
    release_rule: 'weekly; asof=sun'
    replayable: true
    source_name: Computed from CoinGecko market_chart daily history
    fetch_path: deterministic
    tier_floor: 1

  - key: gold
    label: Gold
    table_group: Price & Levels
    ordinal: 11
    value_kind: numeric
    unit: usd_per_oz
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (GC=F)
    fetch_path: deterministic
    tier_floor: 1

  - key: silver
    label: Silver
    table_group: Price & Levels
    ordinal: 12
    value_kind: numeric
    unit: usd_per_oz
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (SI=F)
    fetch_path: deterministic
    tier_floor: 1

  - key: wti
    label: WTI crude
    table_group: Price & Levels
    ordinal: 13
    value_kind: numeric
    unit: usd_per_bbl
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (CL=F)
    fetch_path: deterministic
    tier_floor: 1

  # docs/CONTRACT.md's worked expression example is {"op":"between","series":"brent",
  # "lo":92,"hi":112}, so this key is fixed as `brent`, not `brent_crude`.
  - key: brent
    label: Brent crude
    table_group: Price & Levels
    ordinal: 14
    value_kind: numeric
    unit: usd_per_bbl
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (BZ=F)
    fetch_path: deterministic
    tier_floor: 1

  - key: dxy
    label: Dollar index (DXY)
    table_group: Price & Levels
    ordinal: 15
    value_kind: numeric
    unit: index_points
    decimals: 3
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (DX-Y.NYB)
    fetch_path: deterministic
    tier_floor: 1

  - key: vix
    label: VIX
    table_group: Price & Levels
    ordinal: 16
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^VIX)
    fetch_path: deterministic
    tier_floor: 1

  # The par curve is a Treasury publication on federal business days, not an equity
  # session series: it prints on a day the NYSE is shut for a market holiday only, and
  # not on a federal holiday the NYSE observes. extra on ust_10y carries
  # spread_2s10s_bps.
  - key: ust_30y
    label: 30Y yield
    table_group: Price & Levels
    ordinal: 17
    value_kind: numeric
    unit: percent
    decimals: 2
    cadence: daily
    release_rule: us_business_day
    replayable: true
    source_name: US Treasury daily par curve
    fetch_path: deterministic
    tier_floor: 1

  - key: ust_10y
    label: 10Y yield
    table_group: Price & Levels
    ordinal: 18
    value_kind: numeric
    unit: percent
    decimals: 2
    cadence: daily
    release_rule: us_business_day
    replayable: true
    source_name: US Treasury daily par curve
    fetch_path: deterministic
    tier_floor: 1

  - key: ust_2y
    label: 2Y yield
    table_group: Price & Levels
    ordinal: 19
    value_kind: numeric
    unit: percent
    decimals: 2
    cadence: daily
    release_rule: us_business_day
    replayable: true
    source_name: US Treasury daily par curve
    fetch_path: deterministic
    tier_floor: 1

  # ===========================================================================
  # Sentiment & Positioning
  # ===========================================================================

  # Read from CNN's own chart endpoint, not from aggregators. It was a 09:30 search agent
  # on the belief that CNN's API was blocked; it answers 418 only to a request without a
  # full browser user agent and a cnn.com Referer, and 200 with both (worker/src/macro/
  # fetchers/cnn.py). The endpoint serves one point per US session from any start date,
  # so the series is replayable and a missed run is recovered by the next one.
  # us_session and cadence daily, like breadth: the index is computed on the NYSE close
  # and dated by the session it describes, and Labor Day has no point. Tier 1 because it
  # is the producer's own figure.
  - key: cnn_fear_greed
    label: Fear & Greed, equities
    table_group: Sentiment & Positioning
    ordinal: 1
    value_kind: numeric
    unit: index_0_100
    decimals: 0
    cadence: daily
    release_rule: us_session
    replayable: true
    source_name: CNN Fear & Greed (dataviz graphdata API)
    fetch_path: deterministic
    tier_floor: 1

  - key: crypto_fear_greed
    label: Fear & Greed, crypto
    table_group: Sentiment & Positioning
    ordinal: 2
    value_kind: numeric
    unit: index_0_100
    decimals: 0
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: Alternative.me API
    fetch_path: deterministic
    tier_floor: 1

  # The journal prints allocation and risk appetite in one cell. They are two series:
  # one is a percentage of assets, the other a standardised index, so no single unit
  # could be declared for the pair.
  - key: state_street_equity_allocation
    label: State Street equity allocation
    table_group: Sentiment & Positioning
    ordinal: 3
    value_kind: numeric
    unit: percent
    decimals: 1
    cadence: monthly
    release_rule: 'monthly; asof=eom; release=next_month_day:15'
    replayable: false
    source_name: State Street Institutional Investor Indicators (asserted)
    fetch_path: agent_0930
    tier_floor: 2

  - key: state_street_risk_appetite
    label: State Street risk appetite
    table_group: Sentiment & Positioning
    ordinal: 4
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: monthly
    release_rule: 'monthly; asof=eom; release=next_month_day:15'
    replayable: false
    source_name: State Street Institutional Investor Indicators (asserted)
    fetch_path: agent_0930
    tier_floor: 2

  # Positions are dated Tuesday and released Friday afternoon. extra carries the regime
  # band from the CFTC reference note (sidelined / neutral / heavy / extreme) and
  # open_interest_all.
  - key: cftc_asset_managers_es
    label: CFTC asset managers, ES net
    table_group: Sentiment & Positioning
    ordinal: 5
    value_kind: numeric
    unit: pct_of_oi
    decimals: 2
    cadence: weekly
    release_rule: 'weekly; asof=tue; release=fri'
    replayable: true
    source_name: CFTC TFF API (gpe5-46if)
    fetch_path: deterministic
    tier_floor: 1

  - key: cftc_leveraged_funds_es
    label: CFTC leveraged funds, ES net
    table_group: Sentiment & Positioning
    ordinal: 6
    value_kind: numeric
    unit: pct_of_oi
    decimals: 2
    cadence: weekly
    release_rule: 'weekly; asof=tue; release=fri'
    replayable: true
    source_name: CFTC TFF API (gpe5-46if)
    fetch_path: deterministic
    tier_floor: 1

  # The key docs/CONTRACT.md's worked expression example uses. Every setup gate written
  # to date is a threshold on this series, which is why docs/DECISIONS.md moved it off
  # an LLM path onto a deterministic source: the 21:00 run evaluates gates and an LLM
  # fetch cannot sit there.
  #
  # Computed here from the constituents: TradingView's scanner serves every S&P 500
  # line's close and 200-day average within minutes of the US close, so us_session with
  # no release lag is the truth and the 09:30 run has the session it owes. Barchart's
  # S5TH, the old source, is published about 09:15 UTC the next day, which is why the
  # 09:30 run used to open a gap every morning; it is kept as a cross-check.
  #
  # Replayable. The scanner re-serves the two sessions before the newest, so a missed
  # run fills itself on the next one, and `macro-worker --breadth-backfill` rebuilds any
  # older session from Yahoo closes with the same arithmetic.
  - key: breadth_spx_above_200dma
    label: S&P breadth, % above 200dma
    table_group: Sentiment & Positioning
    ordinal: 7
    value_kind: numeric
    unit: percent
    decimals: 2
    cadence: daily
    release_rule: us_session
    replayable: true
    source_name: Computed from S&P 500 constituents (TradingView scanner), S5TH cross-check
    fetch_path: deterministic
    tier_floor: 1

  # BASIS POINTS. FRED serves percent; normalize multiplies by 100 before storing.
  # ICE publishes with a one-business-day lag, so Friday's reading carries Thursday's
  # asof and is fresh, not stale.
  - key: hy_oas_bps
    label: HY spread (OAS)
    table_group: Sentiment & Positioning
    ordinal: 8
    value_kind: numeric
    unit: bps
    decimals: 0
    cadence: daily
    release_rule: 'us_business_day; release=+1b'
    replayable: true
    source_name: FRED BAMLH0A0HYM2 (fredgraph.csv)
    fetch_path: deterministic
    tier_floor: 1

  - key: ig_oas_bps
    label: IG spread (OAS)
    table_group: Sentiment & Positioning
    ordinal: 9
    value_kind: numeric
    unit: bps
    decimals: 0
    cadence: daily
    release_rule: 'us_business_day; release=+1b'
    replayable: true
    source_name: FRED BAMLC0A0CM (fredgraph.csv)
    fetch_path: deterministic
    tier_floor: 1

  # docs/CONTRACT.md's worked expression example uses the key `move`.
  - key: move
    label: MOVE index
    table_group: Sentiment & Positioning
    ordinal: 10
    value_kind: numeric
    unit: index_points
    decimals: 2
    cadence: session
    release_rule: us_session
    replayable: true
    source_name: Yahoo chart API (^MOVE)
    fetch_path: deterministic
    tier_floor: 1

  - key: btc_dominance
    label: BTC dominance
    table_group: Sentiment & Positioning
    ordinal: 11
    value_kind: numeric
    unit: percent
    decimals: 2
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: CoinGecko global API
    fetch_path: deterministic
    tier_floor: 1

  # value is the median 8-hour funding rate across all listed perpetuals. extra carries
  # funding by symbol for BTC, ETH and SOL plus n_perps.
  - key: funding_skew
    label: Funding skew
    table_group: Sentiment & Positioning
    ordinal: 12
    value_kind: numeric
    unit: pct_per_8h
    decimals: 4
    cadence: daily
    release_rule: calendar_day
    replayable: true
    source_name: Binance Futures API
    fetch_path: deterministic
    tier_floor: 1

  # The numeric companion to the text fedwatch_next_fomc row, and not a
  # replacement for it. The odds for the next meeting are the most-quoted number
  # in any trigger the operator writes ("Oct 28 stays near a coin flip"), and a
  # text series can only ever appear in a manual condition.
  #
  # NOT fetched by the worker. CME's own FedWatch page is a client-rendered
  # application with no keyless endpoint behind it, so this stays on the 09:30
  # search agent and belongs to the authoring run's narrative mode. It is
  # declared here so the registry is complete and a condition naming it
  # validates.
  - key: fedwatch_hike_prob_next
    label: FedWatch hike odds, next FOMC
    table_group: Sentiment & Positioning
    ordinal: 13
    value_kind: numeric
    unit: percent
    decimals: 1
    cadence: daily
    release_rule: us_session
    replayable: false
    source_name: CME FedWatch via aggregator (search agent)
    fetch_path: agent_0930
    tier_floor: 2

  # ===========================================================================
  # Flows & Structure
  # ===========================================================================

  # value is net liquidity itself, in USD. extra carries the three components (WALCL,
  # TGA, RRP) with their own as-ofs, per docs/CONTRACT.md, so they are not separate
  # series. The cadence is the slowest component's: WALCL is the H.4.1 Wednesday
  # balance, released Thursday 16:30 ET, and computing a daily net liquidity off a
  # weekly balance sheet would be a fabricated number.
  - key: net_liquidity
    label: Net liquidity (Fed BS − TGA − RRP)
    table_group: Flows & Structure
    ordinal: 1
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: weekly
    release_rule: 'weekly; asof=wed; release=thu'
    replayable: true
    source_name: FRED WALCL, WTREGEN, RRPONTSYD
    fetch_path: deterministic
    tier_floor: 1

  # The six ETF rows come from one deterministic source, worker/src/macro/fetchers/
  # etf_flows.py: SoSoValue's daily totals, checked against Farside's per-fund table.
  # The daily net flow is read; the week-to-date flow and the streak are computed from
  # it, so all three are one reading per US session and all three are replayable
  # (SoSoValue serves about 300 sessions of history). Tier 1 where SoSoValue and
  # Farside agree within 5% or $10M, Tier 2 otherwise. A session a source has not
  # published complete is missing, never zero. Until 2026-09-24 the weekly flow and
  # the streak were a search agent's, on the 09:30 run only.
  - key: btc_etf_net_flow
    label: BTC ETF daily flow
    table_group: Flows & Structure
    ordinal: 2
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: session
    release_rule: 'us_session; release=+1d'
    replayable: true
    source_name: SoSoValue, checked against Farside
    fetch_path: deterministic
    tier_floor: 1

  # Week to date: the sum of every session of the asof's ISO week up to and including
  # the asof, so Friday's row is the whole week, which is what the journal and every
  # scenario band on it have always meant. No row for a week with a session missing.
  - key: btc_etf_weekly_flow
    label: BTC ETF weekly flow
    table_group: Flows & Structure
    ordinal: 3
    value_kind: numeric
    unit: usd
    decimals: 0
    cadence: session
    release_rule: 'us_session; release=+1d'
    replayable: true
    source_name: Computed from SoSoValue daily flows
    fetch_path: deterministic
    tier_floor: 1

  # A SIGNED SESSION COUNT, not prose: +2 is two consecutive inflow sessions, -4 is four
  # consecutive outflow sessions, 0 is a session whose net flow was exactly zero. A
  # holiday does not break a run. The streak_intact predicate needs an integer and a
  # text series may only appear in a manual condition. See config/predicates.md.
  - key: btc_etf_inflow_streak
    label: BTC ETF inflow streak
    table_group: Flows & Structure
    ordinal: 4
    value_kind: numeric
    unit: sessions
    decimals: 0
    cadence: session
    release_rule: 'us_session; release=+1d'
    replayable: true
    source_name: Computed from SoSoValue daily flows
    fetch_path: deterministic
    tier_floor: 1

  - key: eth_etf_net_flow
    label: ETH ETF daily flow
    table_group: Flows & Structure
    ordinal: 5
    value_kind: numeric
    unit: usd
