[project]
name = "macro-migrate"
version = "0.1.0"
description = "One-shot importer: Obsidian weekly market journal history -> macro_core seed SQL."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
macro-migrate = "macro_migrate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_migrate"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
