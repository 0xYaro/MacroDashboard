[project]
name = "macro-worker"
version = "0.1.0"
description = "Twice-daily ingestion, evaluation and grading for the MacroDashboard regime read"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "curl-cffi>=0.16.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
macro-worker = "macro.main:run"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN",  # annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PTH",  # pathlib
    "RET",  # returns
    "RUF",  # ruff
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # The sentences this worker writes are prose and contain a real unicode minus
    # and real typographic dashes. Rewriting them to ASCII would change what the
    # web app renders verbatim.
    "RUF001",
    "RUF002",
    "RUF003",
    # `Unevaluable` and `WriteRefused` are outcomes this worker expects and
    # handles, not errors in the programming sense, and they read correctly at
    # every call site.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test may annotate nothing: the fakes stand in for vendor payloads that ship
# no types, and a stub method that ignores its arguments is normal.
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN401", "ARG001", "ARG002", "SLF001"]
# A vendor payload really is `Any`. It is whatever the endpoint's JSON decoded
# to, and every one of these functions hands it straight to a normalizer that
# validates the shape and refuses what it does not recognise. A Protocol here
# would claim a shape the vendor does not promise, which is worse than `Any`.
"src/macro/fetchers/*.py" = ["ANN401"]
"src/macro/http.py" = ["ANN401"]
# A condition expression is arbitrary decoded JSON by construction: `evaluate`
# is the function whose job is to decide whether it is a valid one.
"src/macro/expr.py" = ["ANN401"]
"src/macro/observations.py" = ["ANN401"]
"src/macro/evaluate.py" = ["ANN401"]
"src/macro/predicates.py" = ["ANN401"]
# `dec` and `maybe_dec` sit at the vendor edge and take whatever was decoded
# there; narrowing them would only move the same `Any` one frame outward.
"src/macro/units.py" = ["ANN401"]
# An asyncpg row value is `Any` at the driver boundary, and the mart flush
# takes the evaluate step's records structurally so that `store` does not have
# to import every dataclass it writes.
"src/macro/store.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# The suite is deliberately written with loose fakes: a golden payload is a
# bare dict, and a helper that builds one is clearer without a full annotation
# of the vendor's shape. Everything in `src` stays strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false
# An assertion whose whole point is "this value is not that one" reads as a
# non-overlapping comparison, and an assertion after a `is not None` check
# reads as a union access. Both are correct in a test and noise from mypy.
disable_error_code = ["comparison-overlap", "union-attr", "operator", "arg-type", "unreachable"]
# `client=None` in a fetcher test: the fake never touches it.
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
