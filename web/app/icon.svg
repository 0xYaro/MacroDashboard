  <rect x="5" y="15" width="22" height="2" rx="1" fill="#252d35"/>
  <rect x="10" y="13" width="13" height="6" rx="1" fill="#36414c"/>
  <rect x="15" y="9" width="2" height="14" rx="1" fill="#8b98a4"/>
  <rect x="5" y="24.6" width="22" height="1.4" fill="#252d35"/>
</svg>
